<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul Notulen & Tindak Lanjut Rapat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        .bg-teal-custom { background-color: #134e4a !important; }
        .bg-teal-header { background-color: #0f766e !important; }
        .btn-teal { background-color: #0d9488; color: white; border: none; }
        .btn-teal:hover { background-color: #0f766e; color: white; }
        .modal-body { max-height: 75vh; overflow-y: auto; }
        .excel-grid-container { display: flex; flex-direction: column; width: 100%; margin: -8px; }
        .excel-row { display: flex; border-bottom: 1px solid #dee2e6; padding: 8px 10px; align-items: flex-start; background-color: transparent; }
        .excel-row:last-child { border-bottom: none; }
        .excel-text { flex-grow: 1; }
        .table-bordered-grid th, .table-bordered-grid td { border: 1px solid #dee2e6 !important; vertical-align: middle; }
    </style>
</head>
<body class="bg-light" onload="muatDataNotulen()">

    <nav class="navbar navbar-dark bg-teal-custom shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📁 Modul Notulen & Tindak Lanjut Rapat</span>
            <div>
                <a href="jadwal.html" class="btn btn-outline-light btn-sm me-2">← Jadwal Rapat</a>
                <a href="index.html" class="btn btn-outline-light btn-sm">← Kembali ke Dashboard</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row mb-4 align-items-center no-print">
            <div class="col">
                <h3>Pencatatan Hasil Rapat & Action Items</h3>
                <p class="text-muted">Pengelompokan per periode rapat, lokasi, media online/offline, dan sinkronisasi Cloud Real-Time.</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-dark me-2 fw-bold" onclick="window.print()">🖨️ Cetak / Preview PDF</button>
                <button class="btn btn-teal" onclick="bukaModalNotulen()">+ Buat Notulen Baru</button>
            </div>
        </div>

        <div class="card shadow-sm mb-5 border-0">
            <div class="card-body p-0">
                <div id="containerNotulen"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NOTULEN -->
    <div class="modal fade" id="modalNotulen" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-teal-custom text-white">
                    <h5 class="modal-title" id="modalTitleNotulen">Form Notulen & Tindak Lanjut Rapat</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editIndexNotulen" value="-1">
                    <div id="sectionInfoUmum">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Periode Rapat</label>
                                <select id="notulenPeriode" class="form-select">
                                    <option value="Minggu ke-1">Minggu ke-1</option>
                                    <option value="Minggu ke-2">Minggu ke-2</option>
                                    <option value="Minggu ke-3" selected>Minggu ke-3</option>
                                    <option value="Minggu ke-4">Minggu ke-4</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3"><label class="form-label fw-bold">Tanggal Rapat</label><input type="date" id="notulenTanggal" class="form-control"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">📍 Lokasi Rapat</label>
                            <input type="text" id="notulenLokasi" class="form-control" value="Ruang Meeting Kantor Operasional Pasar Tua">
                        </div>
                        <hr class="my-3">
                    </div>
                    
                    <h6 class="text-teal-custom fw-bold mb-3">📝 Masukkan Detail Topik Pembahasan</h6>
                    <div class="mb-3"><label class="form-label">Topik Utama</label><input type="text" id="notulenTopikUtama" class="form-control" placeholder="Contoh: CSMS Expired..."></div>
                    <div class="mb-3"><label class="form-label">Pembahasan & Arahan</label><textarea id="notulenPembahasan" class="form-control" rows="3"></textarea></div>
                    <div class="mb-3"><label class="form-label">Tindak Lanjut & Penyelesaian</label><textarea id="notulenTindakLanjut" class="form-control" rows="4"></textarea></div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Personal in Charge (PIC)</label>
                            <input type="text" id="notulenPic" class="form-control" placeholder="Contoh: Made Fridianto">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Deadline / Due Date</label>
                            <input type="date" id="notulenDeadline" class="form-control">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Status Tindak Lanjut</label>
                        <select id="notulenStatus" class="form-select">
                            <option value="Open">Open</option>
                            <option value="Info">Info</option>
                            <option value="Closing">Closing</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-teal" onclick="simpanNotulen()">Simpan Notulen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let dataNotulen = JSON.parse(localStorage.getItem('bss_notulen')) || [
            {
                periode: "Minggu ke-3",
                tanggal: "2026-08-19",
                lokasi: "Ruang Meeting Kantor Operasional Pasar Tua",
                topikUtama: "CSMS Expired",
                pembahasan: "Segera di Perbaharui",
                tindakLanjut: "Sedang di Susun materinya\nTeam telah membuat drafnya",
                pic: "Made Fridianto",
                deadline: "2026-09-05",
                status: "Open"
            }
        ];

        function muatDataNotulen() {
            renderNotulen();
        }

        function formatTeksExcelGrid(teks) {
            if (!teks) return '-';
            let lines = teks.split('\n');
            let html = '<div class="excel-grid-container">';
            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;
                html += `<div class="excel-row"><div class="excel-text">${trimmed}</div></div>`;
            });
            html += '</div>';
            return html;
        }

        function renderNotulen() {
            const container = document.getElementById('containerNotulen');
            if(!container) return;
            container.innerHTML = '';

            let grouped = {};
            dataNotulen.forEach((item, idx) => {
                item.originalIndex = idx;
                let key = `${item.periode}||${item.tanggal}||${item.lokasi}`;
                if(!grouped[key]) grouped[key] = [];
                grouped[key].push(item);
            });

            for(let key in grouped) {
                let [periode, tanggal, lokasi] = key.split('||');
                let tglF = tanggal;
                try { const p = tanggal.split('-'); tglF = new Date(p[0], p[1]-1, p[2]).toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }); } catch(e){}

                let card = document.createElement('div');
                card.className = 'card mb-4 shadow-sm border-0';
                
                // STRUKTUR TABEL 6 KOLOM LENGKAP SECARA EKSPLISIT
                let html = `<div class="card-header bg-teal-header text-white py-2 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fs-6">📅 Periode: ${periode} | Tanggal: ${tglF} | 📍 Lokasi: ${lokasi}</h5>
                    <button class="btn btn-sm btn-light text-teal fw-bold px-2" onclick="tambahTopikKeRapat('${periode}', '${tanggal}', '${lokasi}')">+ Tambah Topik</button></div>
                    <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0 table-bordered-grid"><thead class="table-light"><tr>
                    <th style="width:15%;">Topik Utama</th>
                    <th style="width:20%;">Pembahasan & Arahan</th>
                    <th style="width:25%;">Tindak Lanjut</th>
                    <th style="width:15%;">Personal in Charge & Due Date</th>
                    <th style="width:10%;" class="text-center">Status</th>
                    <th style="width:15%;" class="text-center">Aksi (Edit / Hapus)</th>
                    </tr></thead><tbody>`;

                grouped[key].forEach(n => {
                    let statusVal = n.status || 'Open';
                    let badge = statusVal === 'Open' ? 'bg-warning text-dark' : statusVal === 'Closing' ? 'bg-success' : 'bg-info text-dark';

                    html += `<tr>
                        <td><strong>${n.topikUtama || '-'}</strong></td>
                        <td>${formatTeksExcelGrid(n.pembahasan)}</td>
                        <td>${formatTeksExcelGrid(n.tindakLanjut)}</td>
                        <td><strong>${n.pic || '-'}</strong><br><small class="text-danger">Due: ${n.deadline || '-'}</small></td>
                        <td class="text-center"><span class="badge ${badge}">${statusVal}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-warning mb-1 px-2 fw-bold" onclick="bukaModalEditNotulen(${n.originalIndex})">✏️ Edit</button>
                            <button class="btn btn-sm btn-outline-danger px-2 fw-bold" onclick="hapusNotulen(${n.originalIndex})">🗑️ Hapus</button>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table></div></div>`;
                card.innerHTML = html;
                container.appendChild(card);
            }
            localStorage.setItem('bss_notulen', JSON.stringify(dataNotulen));
        }

        function tambahTopikKeRapat(periode, tanggal, lokasi) {
            document.getElementById('modalTitleNotulen').innerText = 'Tambah Topik Baru untuk Rapat Ini';
            document.getElementById('editIndexNotulen').value = '-1';
            document.getElementById('sectionInfoUmum').style.display = 'none';
            document.getElementById('notulenPeriode').value = periode;
            document.getElementById('notulenTanggal').value = tanggal;
            document.getElementById('notulenLokasi').value = lokasi;
            
            document.getElementById('notulenTopikUtama').value = '';
            document.getElementById('notulenPembahasan').value = '';
            document.getElementById('notulenTindakLanjut').value = '';
            document.getElementById('notulenPic').value = '';
            document.getElementById('notulenDeadline').value = '';
            document.getElementById('notulenStatus').value = 'Open';
            
            new bootstrap.Modal(document.getElementById('modalNotulen')).show();
        }

        function bukaModalNotulen() {
            document.getElementById('modalTitleNotulen').innerText = 'Buat Notulen Baru';
            document.getElementById('editIndexNotulen').value = '-1';
            document.getElementById('sectionInfoUmum').style.display = 'block';
            document.getElementById('notulenPeriode').value = 'Minggu ke-3';
            document.getElementById('notulenTanggal').value = new Date().toISOString().split('T')[0];
            document.getElementById('notulenLokasi').value = 'Ruang Meeting Kantor Operasional Pasar Tua';
            document.getElementById('notulenTopikUtama').value = '';
            document.getElementById('notulenPembahasan').value = '';
            document.getElementById('notulenTindakLanjut').value = '';
            document.getElementById('notulenPic').value = '';
            document.getElementById('notulenDeadline').value = '';
            document.getElementById('notulenStatus').value = 'Open';
            new bootstrap.Modal(document.getElementById('modalNotulen')).show();
        }

        function bukaModalEditNotulen(index) {
            document.getElementById('modalTitleNotulen').innerText = 'Edit Notulen';
            document.getElementById('editIndexNotulen').value = index;
            document.getElementById('sectionInfoUmum').style.display = 'block';
            const n = dataNotulen[index];
            document.getElementById('notulenPeriode').value = n.periode || 'Minggu ke-3';
            document.getElementById('notulenTanggal').value = n.tanggal || '';
            document.getElementById('notulenLokasi').value = n.lokasi || '';
            document.getElementById('notulenTopikUtama').value = n.topikUtama || '';
            document.getElementById('notulenPembahasan').value = n.pembahasan || '';
            document.getElementById('notulenTindakLanjut').value = n.tindakLanjut || '';
            document.getElementById('notulenPic').value = n.pic || '';
            document.getElementById('notulenDeadline').value = n.deadline || '';
            document.getElementById('notulenStatus').value = n.status || 'Open';
            new bootstrap.Modal(document.getElementById('modalNotulen')).show();
        }

        function simpanNotulen() {
            const index = parseInt(document.getElementById('editIndexNotulen').value);
            const periode = document.getElementById('notulenPeriode').value;
            const tanggal = document.getElementById('notulenTanggal').value;
            const lokasi = document.getElementById('notulenLokasi').value;
            const topikUtama = document.getElementById('notulenTopikUtama').value.trim();
            const pembahasan = document.getElementById('notulenPembahasan').value.trim();
            const tindakLanjut = document.getElementById('notulenTindakLanjut').value.trim();
            const pic = document.getElementById('notulenPic').value.trim() || '-';
            const deadline = document.getElementById('notulenDeadline').value || '-';
            const status = document.getElementById('notulenStatus').value;

            if(!topikUtama) { alert('Topik Utama wajib diisi!'); return; }

            const dataBaru = { periode, tanggal, lokasi, topikUtama, pembahasan, tindakLanjut, pic, deadline, status };
            if(index === -1) dataNotulen.unshift(dataBaru); else dataNotulen[index] = dataBaru;

            renderNotulen();
            bootstrap.Modal.getInstance(document.getElementById('modalNotulen')).hide();
        }

        function hapusNotulen(index) {
            if(confirm('Hapus notulen ini?')) {
                dataNotulen.splice(index, 1);
                renderNotulen();
            }
        }
    </script>
</body>
</html>
