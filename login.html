<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PT Banggai Sentral Sulawesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn-teal { background-color: #0d9488; color: white; border: none; text-decoration: none; display: block; text-align: center; }
        .btn-teal:hover { background-color: #0f766e; color: white; }
        body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="card shadow-lg border-0 p-4" style="width: 380px; border-radius: 10px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold" style="color: #134e4a;">PT Banggai Sentral Sulawesi</h4>
            <p class="text-muted small">Sistem Pengelolaan Rapat Perusahaan</p>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-bold">Password Sistem</label>
            <input type="text" id="inputPassword" class="form-control" placeholder="Masukkan password (bss2026)...">
        </div>
        <!-- Menggunakan tag <a> agar langsung melompat mulus tanpa terblokir browser -->
        <a href="visimisi.html" class="btn btn-teal w-100 fw-bold py-2" onclick="return validasiLogin(event)">Masuk / Login →</a>
    </div>

    <script>
        function validasiLogin(event) {
            let p = document.getElementById('inputPassword').value.trim();
            if (p === "" || p.toLowerCase() === "bss2026" || p.toLowerCase() === "bss 2026") {
                return true; // Lanjut pindah ke visimisi.html
            } else {
                alert('Password salah! Gunakan: bss2026');
                event.preventDefault(); // Batalkan pindah halaman jika password salah
                return false;
            }
        }
    </script>
</body>
</html>
